allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

# Skip versions published less than a day ago (supply-chain attack window).
minimumReleaseAge: 1440

overrides:
  '@vscode/markdown-it-katex>katex': ^0.19.0
  gray-matter>js-yaml: ^3.15.2
  # Dependabot alert #160: ESLint's deps still pin minimatch 10; remove once they move to >= 11.0.1.
  minimatch@>=7 <11.0.1: ^11.0.1

# eslint-config-next supports ESLint 10, but some bundled plugins have not
# updated their peer ranges yet (https://nextjs.org/docs/app/api-reference/config/eslint).
peerDependencyRules:
  allowedVersions:
    eslint: '10'
